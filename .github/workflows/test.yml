name: SQLense CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

env:
  LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          (cd packages/websocket-server && npm ci)
          (cd packages/api-server && npm ci)
      - name: TypeScript check
        run: |
          (cd packages/websocket-server && npx tsc --noEmit)
          (cd packages/api-server && npx tsc --noEmit)

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integration tests
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "LLM_API_KEY not set, skipping integration tests"
            exit 0
          fi
          docker compose up -d --build postgres ai-gateway
          echo "Waiting for AI gateway..."
          timeout 120 bash -c '
            until curl -sf http://localhost:8000/openapi.json >/dev/null 2>&1; do
              sleep 3
            done
          '
          echo "AI gateway is ready"
          curl -sf http://localhost:8000/openapi.json | \
            python3 -c "import json,sys; d=json.load(sys.stdin); assert 'analyze' in [p.split('/')[-1] for p in d['paths']]; print('✅ AI gateway OK')"
