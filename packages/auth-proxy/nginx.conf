server {
    listen 8080;
    # DNS服务器在127.0.0.11 DNS结果缓存10s
    resolver 127.0.0.11 valid=10s;

    location /internal-auth {
        # 只接收内部子请求
        internal;
        proxy_pass http://api-server:4000/api/auth/verify;
        # 不需要转发原始请求体
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # 捕获组1：学号数字 捕获组2：可选路径后缀
    location ~ ^/student-(\d+)(/.*)?$ {
        set $student_port $1;
        set $suffix $2;

        # 内部请求只看状态码
        auth_request /internal-auth;

        # 把URL中的学号部分去掉（rewrite <regex> <replacement> <flag>）
        rewrite ^ /$suffix break;
        proxy_pass http://host.docker.internal:$student_port;
        # 支持WS
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 透传原始host
        proxy_set_header Host $host;
    }

    location /health {
        return 200 "ok";
    }
}
