server {
    listen 8080;
    # DNS服务器在127.0.0.11 DNS结果缓存10s
    resolver 127.0.0.11 valid=10s;

    location /internal-auth {
        # 只接收内部子请求
        internal;
        set $api_upstream http://api-server:4000/api/auth/verify;
        proxy_pass $api_upstream;
        # 不需要转发原始请求体
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # 捕获组1：学号数字 捕获组2：可选路径后缀
    location ~ ^/student-(\d+)(/.*)?$ {
        set $student_id $1;
        set $suffix $2;

        # 优先取全局 nginx 注入的 X-Forwarded-Proto，没有才用自身 $scheme
        set $forwarded_proto $http_x_forwarded_proto;
        if ($forwarded_proto = "") { set $forwarded_proto $scheme; }

        # 内部请求只看状态码
        auth_request /internal-auth;

        # 去掉学号前缀，加上 X-Student-Id header
        set $cs_upstream http://code-server:8443;
        rewrite ^ $suffix break;
        proxy_pass $cs_upstream;
        proxy_set_header X-Student-Id $student_id;
        # 兜底：code-server 返回 ./?folder=...，浏览器自己会解析，不需要手动重写
        # 支持WS
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 透传原始host（原始值含端口，生产全局nginx已剥掉）
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /health {
        return 200 "ok";
    }
}
