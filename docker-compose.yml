# ============================================================
# SQLense — 数据库实验教学平台
# 7 个容器：postgres / api-server / websocket / ai-gateway /
#            auth-proxy / web / code-server
# ============================================================

name: sqlense

services:
  # ─── 1. PostgreSQL — 系统数据库 ────────────────────────────
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sqlense
      POSTGRES_PASSWORD: sqlense
      POSTGRES_DB: sqlense
    volumes:
      - pgdata:/var/lib/postgresql/data          # 持久化存储
      - ./packages/api-server/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro   # 建表语句
      - ./packages/api-server/sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro   # 预设数据
      - ./packages/api-server/sql/03-create-dbs.sql:/docker-entrypoint-initdb.d/03-create-dbs.sql:ro   # 创建学生库
    healthcheck:
      # 先检查 pg 就绪，再确认 seed 已执行完成（system.users 表有数据）
      test: ["CMD-SHELL", "pg_isready -U sqlense -d sqlense && psql -U sqlense -d sqlense -c 'SELECT 1 FROM system.users LIMIT 1'"]
      interval: 3s
      retries: 20

  # ─── 2. API Server — Express REST 接口 ─────────────────────
  api-server:
    build:
      context: ./packages/api-server
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      API_PORT: 4000
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}         # 启动时更新 admin 密码，留空或 admin 则不更新
      JWT_SECRET: ${JWT_SECRET:-sqlense-dev-secret}   # JWT 签名密钥，生产环境务必修改
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: sqlense
      PG_PASSWORD: sqlense
      PG_DATABASE: sqlense
      FILE_DIR: /srv/files                             # 教师共享文件的存储目录
    volumes:
      - files:/srv/files
    depends_on:
      postgres:
        condition: service_healthy

  # ─── 3. WebSocket 服务器 ──────────────────────────────────
  websocket:
    restart: unless-stopped
    build:
      context: ./packages/websocket-server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      AI_GATEWAY_URL: http://ai-gateway:8000            # AI 网关地址
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: sqlense
      PG_PASSWORD: sqlense
      PG_DATABASE: sqlense
    depends_on:
      postgres:
        condition: service_healthy

  # ─── 4. AI Gateway — Python FastAPI ────────────────────────
  # 接收 WS 服务器转发的遥测，运行 LLM 分析（Code/SQL/Judge Agent）
  ai-gateway:
    build:
      context: ./packages/ai-gateway
    ports:
      - "8000:8000"
    environment:
      # LLM 配置：未配置时回退规则引擎（PriorityScorer）
      LLM_API_KEY: ${LLM_API_KEY:-sk-placeholder}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      PG_DSN: postgresql://sqlense:sqlense@postgres:5432/sqlense  # 连接系统 DB 读任务文件
      FILE_DIR: /srv/files
    volumes:
      - files:/srv/files
    depends_on:
      postgres:
        condition: service_healthy

  # ─── 5. Auth Proxy — Nginx 反向代理 ──────────────────────
  # 对学生 code-server 做 auth_request 鉴权，阻止未登录访问
  auth-proxy:
    build:
      context: ./packages/auth-proxy
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - api-server

  # ─── 6. Web — React SPA（教师控制台 + 学生仪表盘） ────────
  web:
    restart: unless-stopped
    build:
      context: ./packages/web
      dockerfile: Dockerfile
    ports:
      - "3000:80"                      # 宿主机 3000 → 容器内 nginx 80
    depends_on:
      - api-server
      - websocket
      - ai-gateway

  # ─── 7. code-server（单容器，X-Student-Id 路由） ────────────
  # 所有学生共享一个 VS Code Server，通过 X-Student-Id header 区分工作区。
  # 扩展首次启动时安装到 shared-ext volume。学生 settings.json 由
  # ensureStudentWorkspace() 懒加载创建（调用 API /workspace-env）。
  code-server:
    image: sqlense-code-server:latest
    ports: ["8443:8443"]
    environment:
      API_SERVER_URL: http://api-server:4000
      WS_SERVER: ws://websocket:3001
      SQLENSE_WS_SERVER: ws://websocket:3001
      CODE_SERVER_RECONNECTION_GRACE_TIME: "0"
      PG_HOST: postgres
    volumes:
      - shared-ext:/workspaces/.shared-extensions
      - ./packages/vs-code-extension:/opt/extensions/sqlense-vscode:ro
      - ./packages/code-server/startup.sh:/startup.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:          # PostgreSQL 数据持久化（Docker 自动创建 named volume）
  files:           # 教师共享文件存储（Docker 自动创建）
  shared-ext:      # code-server 共享扩展存储（Docker 自动创建）
